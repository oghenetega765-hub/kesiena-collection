<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Room | Victory Collections</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- CDN Scripts for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <nav class="nav-links">
      <a href="index.html">← Back to Home</a>
      <a href="index.html#books">All Books</a>
    </nav>
    <div class="logo-container">
      <img src="assets/logo.png" alt="KC Victory Collections Logo" class="top-logo" />
    </div>
  </header>

  <!-- Reader Container -->
  <main class="reader-container">
    
    <!-- Sidebar: Chapter Selector -->
    <aside class="chapter-sidebar">
      <div class="book-info">
        <img id="current-cover" src="assets/the-probability-of-us.jpg" alt="Book Cover" class="sidebar-cover" />
        <h3 id="current-book-title">The Probability of Us</h3>
        <p class="author-sub">by Akpovoka Kesiena</p>
      </div>

      <div class="chapter-list-wrapper">
        <h4>Chapters</h4>
        <ul id="chapter-list" class="chapter-list">
          <!-- Dynamically populated -->
        </ul>
      </div>
    </aside>

    <!-- Main Content Reading Area -->
    <section class="reader-main">
      <div class="chapter-header">
        <span id="chapter-number-badge" class="badge active">Chapter 1</span>
        <h1 id="chapter-title">Loading Chapter...</h1>
        <p id="publish-date" class="publish-date"></p>
      </div>

      <!-- Embedded Facebook Media Container (if available) -->
      <div id="media-container" class="media-container" style="display: none;"></div>

      <!-- Chapter Body Text -->
      <article id="chapter-body" class="chapter-body">
        <p class="loading-text">Loading content...</p>
      </article>

      <!-- Navigation Buttons -->
      <div class="reader-nav">
        <button id="prev-btn" class="btn-gold-outline" disabled>← Previous Chapter</button>
        <button id="next-btn" class="btn-gold">Next Chapter →</button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Victory Collections | Akpovoka Kesiena. All Rights Reserved.</p>
  </footer>

  <!-- Reader JavaScript Engine -->
  <script>
    const bookData = {
      title: "The Probability of Us",
      cover: "assets/the-probability-of-us.jpg",
      chapters: [
        {
          id: 1,
          title: "Chapter 1: The Encounter",
          date: "September 1, 2026",
          facebookEmbed: "",
          content: `Welcome to **The Probability of Us**.

This is the beginning of the journey. Distance, devotion, and destiny pull two souls across boundaries...`
        },
        {
          id: 2,
          title: "Chapter 2: Lines in the Sand",
          date: "September 8, 2026",
          facebookEmbed: "",
          content: `The story continues in Chapter 2...`
        }
      ]
    };

    let currentChapterIndex = 0;

    function loadChapter(index) {
      const chapter = bookData.chapters[index];
      if (!chapter) return;

      currentChapterIndex = index;

      document.getElementById("chapter-number-badge").innerText = `Chapter ${chapter.id}`;
      document.getElementById("chapter-title").innerText = chapter.title;
      document.getElementById("publish-date").innerText = `Published on ${chapter.date}`;

      const mediaContainer = document.getElementById("media-container");
      if (chapter.facebookEmbed && chapter.facebookEmbed.trim() !== "") {
        mediaContainer.style.display = "block";
        mediaContainer.innerHTML = chapter.facebookEmbed;
      } else {
        mediaContainer.style.display = "none";
        mediaContainer.innerHTML = "";
      }

      document.getElementById("chapter-body").innerHTML = marked.parse(chapter.content);

      document.getElementById("prev-btn").disabled = (index === 0);
      document.getElementById("next-btn").disabled = (index === bookData.chapters.length - 1);

      updateSidebarHighlight(index);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildSidebar() {
      const listContainer = document.getElementById("chapter-list");
      listContainer.innerHTML = "";

      bookData.chapters.forEach((chap, idx) => {
        const li = document.createElement("li");
        li.innerText = chap.title;
        li.className = idx === 0 ? "active-chap" : "";
        li.onclick = () => loadChapter(idx);
        listContainer.appendChild(li);
      });
    }

    function updateSidebarHighlight(index) {
      const items = document.querySelectorAll("#chapter-list li");
      items.forEach((item, idx) => {
        if (idx === index) {
          item.classList.add("active-chap");
        } else {
          item.classList.remove("active-chap");
        }
      });
    }

    document.getElementById("prev-btn").addEventListener("click", () => {
      if (currentChapterIndex > 0) loadChapter(currentChapterIndex - 1);
    });

    document.getElementById("next-btn").addEventListener("click", () => {
      if (currentChapterIndex < bookData.chapters.length - 1) loadChapter(currentChapterIndex + 1);
    });

    window.addEventListener("DOMContentLoaded", () => {
      buildSidebar();
      loadChapter(0);
    });
  </script>

</body>
</html>
